<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYTECH · Portal PIPING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --header-blue: #00589E;
    --header-blue-dark: #00436F;
    --navy: #113044;
    --blue-light: #3B8ACA;
    --bg: #F6F7F9;
    --bg-panel: #FFFFFF;
    --text: #1B2733;
    --text-dim: #647485;
    --border: #E2E7ED;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, Segoe UI, sans-serif;
    --head: 'Montserrat', 'Arial', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  a{color:inherit; text-decoration:none;}

  header{
    background: var(--header-blue);
    padding: 14px 32px;
    display:flex; align-items:center;
    box-shadow: 0 2px 10px rgba(0,67,111,0.25);
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .brand img{height:42px; width:auto; display:block;}
  .brand-div{width:1px; height:32px; background:rgba(255,255,255,0.25);}
  .brand-text h1{
    font-family:var(--head); font-size:16px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:#fff;
  }
  .brand-text p{font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,0.75); letter-spacing:0.08em; margin-top:3px;}

  .mother-tabs{display:flex; gap:4px; background:var(--header-blue-dark); padding: 0 32px;}
  .mother-tab{
    font-family:var(--head); font-size:13px; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase;
    color:rgba(255,255,255,0.65);
    padding:13px 18px; cursor:pointer;
    border-bottom:3px solid transparent;
    transition: all .15s ease;
  }
  .mother-tab:hover{color:#fff;}
  .mother-tab.active{color:#fff; border-bottom-color:var(--blue-light);}

  .layout{display:grid; grid-template-columns:270px 1fr; min-height:calc(100vh - 114px);}

  nav{border-right:1px solid var(--border); padding:22px 0; background:#fff;}
  .nav-label{
    font-family:var(--mono); font-size:10px; color:var(--text-dim);
    letter-spacing:0.15em; padding: 6px 24px 10px; text-transform:uppercase;
  }
  .nav-group{margin-bottom:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:12px 24px; font-family:var(--head); font-size:14px; font-weight:700;
    letter-spacing:0.02em; color:var(--navy);
    border-left:3px solid transparent; cursor:pointer;
    transition: all .15s ease; text-transform:uppercase;
  }
  .nav-item:hover{background:rgba(0,88,158,0.05);}
  .nav-item.open{color:var(--header-blue);}
  .nav-item .chev{margin-left:auto; font-size:11px; color:var(--text-dim); transition: transform .2s ease;}
  .nav-item.open .chev{transform: rotate(90deg); color:var(--header-blue);}
  .subnav{max-height:0; overflow:hidden; transition: max-height .25s ease;}
  .subnav.open{max-height:600px;}
  .sub-item{
    padding:9px 24px 9px 44px; font-size:13.5px; color:var(--text-dim);
    border-left:3px solid transparent; cursor:pointer;
    transition: all .15s ease; font-family:var(--sans); font-weight:500;
  }
  .sub-item:hover{color:var(--navy);}
  .sub-item.active{color:var(--header-blue); border-left-color:var(--header-blue); background:rgba(0,88,158,0.06); font-weight:600;}

  main{padding:32px 40px;}
  .crumbs{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:10px; letter-spacing:0.05em;}
  .crumbs b{color:var(--header-blue);}
  .page-title{font-family:var(--head); font-size:30px; font-weight:800; letter-spacing:0.01em; text-transform:uppercase; color:var(--navy); margin-bottom:10px;}
  .title-bar{width:64px; height:4px; background:var(--header-blue); margin-bottom:18px;}
  .page-sub{color:var(--text-dim); font-size:14px; margin-bottom:28px;}

  .grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px;}
  .card{
    background: var(--bg-panel); border:1px solid var(--border);
    padding:18px; position:relative; border-radius:2px;
    box-shadow: 0 1px 3px rgba(17,48,68,0.05);
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{border-color:var(--header-blue); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,88,158,0.12);}
  .card::before{content:""; position:absolute; top:0; left:0; width:14px; height:14px; border-top:2px solid var(--header-blue); border-left:2px solid var(--header-blue);}
  .card::after{content:""; position:absolute; bottom:0; right:0; width:14px; height:14px; border-bottom:2px solid var(--header-blue); border-right:2px solid var(--header-blue);}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
  .file-tag{font-family:var(--mono); font-size:10px; font-weight:700; color:#fff; background:var(--header-blue); padding:3px 7px; letter-spacing:0.05em; border-radius:2px;}
  .file-tag.pdf{background:var(--navy);}
  .file-size{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .card-name{font-size:15px; font-weight:700; margin-bottom:4px; color:var(--navy);}
  .card-desc{font-size:12.5px; color:var(--text-dim); margin-bottom:16px; line-height:1.5;}
  .card-footer{display:flex; align-items:center; justify-content:flex-end;}
  .dl-btn{
    font-family:var(--mono); font-size:11px; font-weight:600; color:var(--header-blue);
    border:1px solid var(--header-blue); padding:7px 12px; letter-spacing:0.04em;
    display:flex; align-items:center; gap:6px; transition: all .15s ease; border-radius:2px;
  }
  .dl-btn:hover{background:var(--header-blue); color:#fff;}
  .empty{color:var(--text-dim); font-family:var(--mono); font-size:13px;}

  .cmd-table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border);}
  .cmd-table thead th{
    text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-dim); background:#F0F3F6;
    padding:12px 16px; border-bottom:1px solid var(--border);
  }
  .cmd-table tbody td{padding:14px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:top;}
  .cmd-table tbody tr:last-child td{border-bottom:none;}
  .cmd-table tbody tr:hover{background:rgba(0,88,158,0.03);}
  .cmd-name{font-family:var(--mono); font-weight:600; color:var(--navy); white-space:nowrap;}
  .cmd-desc{color:var(--text-dim); line-height:1.5;}
  .cmd-dl{white-space:nowrap; text-align:right;}

  @media (max-width: 780px){
    .layout{grid-template-columns:1fr;}
    nav{border-right:none; border-bottom:1px solid var(--border);}
    main{padding:22px 18px;}
    header{padding:14px 18px;}
    .mother-tabs{padding:0 18px; overflow-x:auto;}
    .brand-div{display:none;}
    .cmd-table{font-size:12px;}
  }
</style>
</head>

  const motherTabs = document.getElementById('mother-tabs');
  const nav = document.getElementById('nav');
  const content = document.getElementById('content');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const crumbs = document.getElementById('crumbs');

  function buildMotherTabs(){
    Object.entries(menus).forEach(([key, menu]) => {
      const tab = document.createElement('div');
      tab.className = 'mother-tab';
      tab.textContent = menu.label;
      tab.dataset.menu = key;
      tab.addEventListener('click', () => selectMenu(key));
      motherTabs.appendChild(tab);
    });
  }

  function selectMenu(menuKey){
    document.querySelectorAll('.mother-tab').forEach(t => t.classList.toggle('active', t.dataset.menu === menuKey));
    buildNav(menuKey);
  }

  function buildNav(menuKey){
    nav.innerHTML = '<div class="nav-label">Categorías</div>';
    const menu = menus[menuKey];
    let firstCat = null, firstSub = null;

    Object.entries(menu.categories).forEach(([catKey, cat]) => {
      const group = document.createElement('div');
      group.className = 'nav-group';
      const item = document.createElement('div');
      item.className = 'nav-item';

      if(menu.type === 'list'){
        item.innerHTML = `<span>${cat.label}</span>`;
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('open'));
          item.classList.add('open');
          renderList(menuKey, catKey);
        });
        group.appendChild(item);
        if(!firstCat) firstCat = catKey;
      } else {
        item.innerHTML = `<span>${cat.label}</span><span class="chev">›</span>`;
        group.appendChild(item);

        const subnav = document.createElement('div');
        subnav.className = 'subnav';
        Object.keys(cat.subcats).forEach(subKey => {
          const sub = cat.subcats[subKey];
          const subItem = document.createElement('div');
          subItem.className = 'sub-item';
          subItem.textContent = sub.label;
          subItem.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.sub-item').forEach(s => s.classList.remove('active'));
            subItem.classList.add('active');
            renderCards(menuKey, catKey, subKey);
          });
          subnav.appendChild(subItem);
          if(!firstCat){ firstCat = catKey; firstSub = subKey; }
        });
        group.appendChild(subnav);

        item.addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('open'));
          document.querySelectorAll('.subnav').forEach(s => s.classList.remove('open'));
          if(!isOpen){
            item.classList.add('open');
            subnav.classList.add('open');
          }
        });
      }
      nav.appendChild(group);
    });

    if(menu.type === 'list'){
      nav.querySelector('.nav-item').classList.add('open');
      renderList(menuKey, firstCat);
    } else {
      nav.querySelector('.nav-item').classList.add('open');
      nav.querySelector('.subnav').classList.add('open');
      nav.querySelector('.sub-item').classList.add('active');
      renderCards(menuKey, firstCat, firstSub);
    }
  }

  function renderCards(menuKey, catKey, subKey){
    const menu = menus[menuKey];
    const cat = menu.categories[catKey];
    const sub = cat.subcats[subKey];
    pageTitle.textContent = sub.label;
    pageSub.textContent = sub.sub;
    crumbs.innerHTML = `<b>${menu.label.toUpperCase()}</b> / ${cat.label.toUpperCase()} / <b>${sub.label.toUpperCase()}</b>`;

    if(sub.files.length === 0){
      content.innerHTML = '<div class="empty">Sin archivos cargados todavía.</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    sub.files.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="file-tag ${f.type.toLowerCase()}">${f.type}</span>
          <span class="file-size">${f.size}</span>
        </div>
        <div class="card-name">${f.name}</div>
        <div class="card-desc">${f.desc}</div>
        <div class="card-footer">
          <a class="dl-btn" href="${f.url}" download>↓ DESCARGAR</a>
        </div>
      `;
      grid.appendChild(card);
    });
    content.innerHTML = '';
    content.appendChild(grid);
  }

  function renderList(menuKey, catKey){
    const menu = menus[menuKey];
    const cat = menu.categories[catKey];
    pageTitle.textContent = cat.label;
    pageSub.textContent = cat.sub;
    crumbs.innerHTML = `<b>${menu.label.toUpperCase()}</b> / <b>${cat.label.toUpperCase()}</b>`;

    if(cat.items.length === 0){
      content.innerHTML = '<div class="empty">Sin comandos cargados todavía.</div>';
      return;
    }
    const table = document.createElement('table');
    table.className = 'cmd-table';
    table.innerHTML = `
      <thead><tr><th>Comando</th><th>Para qué sirve</th><th></th></tr></thead>
      <tbody>
        ${cat.items.map(i => `
          <tr>
            <td class="cmd-name">${i.name}</td>
            <td class="cmd-desc">${i.desc}</td>
            <td class="cmd-dl"><a class="dl-btn" href="${i.url}" download>↓ DESCARGAR</a></td>
          </tr>
        `).join('')}
      </tbody>
    `;
    content.innerHTML = '';
    content.appendChild(table);
  }

  buildMotherTabs();
  selectMenu('descargables');
</script>

</body>
</html>
